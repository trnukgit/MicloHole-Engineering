<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool - MORPHO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="tool.css">
</head>
<body>

    <div id="page-fader"></div>

    <div class="container">

        <header>
            <nav>
                <ul class="nav-left">
                    <li><a href="index.html">Top</a></li>
                    <li><a href="tool.html">Tool</a></li>
                </ul>
                <div class="logo">
                    <a href="index.html">
                        <img src="Assets/morpho-logo.png" alt="MORPHO Logo">
                    </a>
                </div>
                <ul class="nav-right">
                </ul>
            </nav>
        </header>

        <main class="tool-main">
            <h1 class="tool-page-title">Tools</h1>
            <p class="tool-page-subtitle">微細穴加工による視覚効果をデザインするためのツール</p>

            <div class="tool-cards">
                <a href="signage-simulation.html" class="tool-card">
                    <div class="tool-card-icon">
                        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="8" y="12" width="48" height="32" rx="2"/>
                            <line x1="32" y1="44" x2="32" y2="52"/>
                            <line x1="24" y1="52" x2="40" y2="52"/>
                            <circle cx="20" cy="28" r="4"/>
                            <circle cx="32" cy="28" r="4"/>
                            <circle cx="44" cy="28" r="4"/>
                        </svg>
                    </div>
                    <h2 class="tool-card-title">Signage Simulation</h2>
                    <p class="tool-card-desc">
                        サイン・看板の見え方をシミュレーション。<br>
                        文字ごとの可視範囲を確認できます。
                    </p>
                    <span class="tool-card-arrow">→</span>
                </a>

                <a href="parameter-optimization.html" class="tool-card">
                    <div class="tool-card-icon">
                        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="32" cy="20" r="8"/>
                            <circle cx="20" cy="40" r="6"/>
                            <circle cx="44" cy="40" r="6"/>
                            <line x1="32" y1="28" x2="24" y2="34"/>
                            <line x1="32" y1="28" x2="40" y2="34"/>
                            <rect x="10" y="50" width="44" height="6" rx="1"/>
                        </svg>
                    </div>
                    <h2 class="tool-card-title">Parameter Optimization</h2>
                    <p class="tool-card-desc">
                        最適な穴パラメータを自動探索。<br>
                        目標角度に合った設計を支援します。
                    </p>
                    <span class="tool-card-arrow">→</span>
                </a>
            </div>
        </main>

    </div>

    <script src="common.js"></script>

</body>
</html>
